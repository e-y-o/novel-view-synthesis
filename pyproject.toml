[project]
name = "nvs"
version = "0.0.0"
description = "Fast single-image novel view synthesis with a web GUI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "depth-pro-2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.9.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# PyTorch CUDA 13.0 wheels (stable). Needed for Blackwell (sm_120) support.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
depth-pro-2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2", rev = "aa389cbb0b74341664ed663a0966c859905cd6c0" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
infill = [
    "accelerate>=1.16.0",
    "diffusers>=0.43.0",
    "einops>=0.8.2",
    "gguf>=0.19.0",
    "omegaconf>=2.4.0",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "psutil>=7.2.2",
    "safetensors>=0.8.0",
    "transformers>=5.24.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project.scripts]
nvs = "nvs.cli.main:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "B023"]  # table-printing tools; benchmark lambdas run inside their loop iteration

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "slow: slow test",
]
